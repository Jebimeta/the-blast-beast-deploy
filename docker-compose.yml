name: the-blast-beast

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-blastbeast}
      POSTGRES_USER: ${DB_USER:-blastbeast}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blastbeast}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blastbeast} -d ${DB_NAME:-blastbeast}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./the-blast-beast-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-blastbeast}
      DB_USER: ${DB_USER:-blastbeast}
      DB_PASSWORD: ${DB_PASSWORD:-blastbeast}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8088}
      # Vacío = usa SITE_BASE_URL; si se define, lo sustituye. Separa con comas.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # En producción, define JWT_SECRET en el entorno: este valor es solo para desarrollo.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-chars-min}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_LOGIN_WINDOW: ${AUTH_LOGIN_WINDOW:-PT15M}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_MAX_ATTEMPTS_PER_IP: ${AUTH_LOGIN_MAX_ATTEMPTS_PER_IP:-20}
      STORAGE_LOCAL_ROOT: /app/data/media
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8088/media}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Redacción Blast Beast}
      TICKETMASTER_ENABLED: ${TICKETMASTER_ENABLED:-false}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT: ${AI_TIMEOUT:-20s}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"
    volumes:
      - media:/app/data/media

  web:
    build:
      context: ./the-blast-beast-web
      args:
        SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8088}
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8088}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      PORT: 4000
    ports:
      - "4000:4000"

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-http://localhost}
    ports:
      - "${CADDY_PORT:-8088}:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
